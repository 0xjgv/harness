name: CI

on:
  push:
    branches: [main]
  pull_request:

# Local gate == remote gate: this runs the same `harness ci` you run locally.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep bun-version equal to package.json's `packageManager` field so CI and
      # local run the same runtime. Nothing enforces it: the runner compares the
      # running bun to `packageManager`, never to this file. Bump both together.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      # uv provides `uvx`, which the complexity and CRAP gates use to run lizard.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI gate
        run: bun harness.ts ci
