name: CI

on:
  push:
    branches: [main]
  pull_request:

# Local gate == remote gate: this runs the same `harness ci` you run locally.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned so the remote gate resolves the same toolchain as the lock, not
      # whatever the runner image ships that week. `python-version` sets
      # UV_PYTHON, which both `uv python install` and `uv sync` honor; it is the
      # `requires-python` floor from pyproject.toml.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
          python-version: "3.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Run CI gate
        run: uv run harness ci
