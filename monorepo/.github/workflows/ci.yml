name: CI

on:
  push:
    branches: [main]
  pull_request:

# Local and remote use the same checked-in deterministic provisioner and CI gate:
# `make workspace`, then `make ci`.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision workspace
        run: make workspace

      - name: Run CI gate
        run: make ci
