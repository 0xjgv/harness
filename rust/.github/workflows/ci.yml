name: CI

on:
  push:
    branches: [main]
  pull_request:

# Local gate == remote gate: this runs the same `harness ci` you run locally.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to match rust-toolchain.toml so the remote gate compiles with the
      # same rustc as the local one.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt, llvm-tools-preview

      # uv provides `uvx`, which the complexity and CRAP gates use to run lizard.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Prebuilt binaries, so the install stays fast. cargo-audit is required by
      # ci's strict audit gate; cargo-llvm-cov and cargo-modules back the
      # coverage/CRAP and arch gates. cargo-mutants is NOT used by `harness ci`
      # (mutation is advisory and explicitly invoked) — it is installed so this
      # list is the single place all four pins are stated and `cargo harness
      # mutation` is runnable in an added step. Keep the versions equal to the
      # CARGO_*_VERSION constants in harness.rs; bump both together.
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1,cargo-llvm-cov@0.8.7,cargo-modules@0.26.0,cargo-mutants@27.0.0

      - name: Run CI gate
        run: cargo harness ci
